<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V-Trigger</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      overflow-x: hidden;
    }

    /* ─── HEADER ─── */
    .header {
      background: linear-gradient(135deg, #CC0000 0%, #8B0000 100%);
      padding: 20px 20px 24px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: -20px;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: white;
      letter-spacing: -1px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: white;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #4cff91;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.inactive {
      background: #aaa;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    .header-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    /* ─── STATS BAR ─── */
    .stats-bar {
      background: #1a1a1a;
      display: flex;
      padding: 10px 20px;
      gap: 0;
    }

    .stat {
      flex: 1;
      text-align: center;
    }

    .stat + .stat {
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: #CC0000;
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ─── BODY ─── */
    .body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ─── SECTION HEADER ─── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* ─── INPUT AREA ─── */
    .input-row {
      display: flex;
      gap: 8px;
    }

    .word-input {
      flex: 1;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .word-input::placeholder {
      color: #bbb;
    }

    .word-input:focus {
      border-color: #CC0000;
      box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.1);
    }

    .add-btn {
      background: linear-gradient(135deg, #CC0000, #990000);
      border: none;
      border-radius: 10px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(204, 0, 0, 0.4);
    }

    .add-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .add-btn svg {
      width: 18px;
      height: 18px;
      stroke: white;
      stroke-width: 2.5;
      fill: none;
    }

    /* ─── CHIPS ─── */
    .chips-container {
      min-height: 44px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }

    .empty-state {
      width: 100%;
      text-align: center;
      padding: 14px 0;
      font-size: 12px;
      color: #ccc;
      font-style: italic;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 20px;
      padding: 5px 10px 5px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #1a1a1a;
      animation: chipIn 0.2s ease;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .chip:hover {
      border-color: #CC0000;
      box-shadow: 0 2px 8px rgba(204, 0, 0, 0.12);
    }

    @keyframes chipIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .chip-remove {
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .chip-remove:hover {
      background: #CC0000;
    }

    .chip-remove:hover svg {
      stroke: white;
    }

    .chip-remove svg {
      width: 10px;
      height: 10px;
      stroke: #888;
      stroke-width: 2.5;
      fill: none;
      transition: stroke 0.15s;
    }

    /* ─── MATCH TYPE ─── */
    .match-section {
      background: white;
      border-radius: 12px;
      padding: 16px;
      border: 1.5px solid #e8e8e8;
    }

    .match-options {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .match-option {
      flex: 1;
      position: relative;
    }

    .match-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .match-option label {
      display: block;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      background: #fafafa;
    }

    .match-option label .opt-title {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      display: block;
    }

    .match-option label .opt-desc {
      font-size: 10px;
      color: #aaa;
      display: block;
      margin-top: 2px;
    }

    .match-option input[type="radio"]:checked + label {
      border-color: #CC0000;
      background: linear-gradient(135deg, rgba(204,0,0,0.06), rgba(204,0,0,0.02));
    }

    .match-option input[type="radio"]:checked + label .opt-title {
      color: #CC0000;
    }

    .match-option input[type="radio"]:checked + label .opt-desc {
      color: rgba(204,0,0,0.6);
    }

    .match-option label:hover {
      border-color: #CC0000;
    }

    /* ─── CLEAR ALL ─── */
    .footer-actions {
      display: flex;
      justify-content: flex-end;
    }

    .clear-btn {
      background: none;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .clear-btn:hover {
      border-color: #CC0000;
      color: #CC0000;
      background: rgba(204,0,0,0.04);
    }

    .clear-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .clear-btn:disabled:hover {
      border-color: #e0e0e0;
      color: #999;
      background: none;
    }

    /* ─── DIVIDER ─── */
    .divider {
      height: 1px;
      background: #f0f0f0;
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1a1a1a;
      color: white;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">V</div>
        <span class="logo-text">V-Trigger</span>
      </div>
      <div class="status-badge" id="statusBadge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Active</span>
      </div>
    </div>
    <div class="header-sub">Facebook Post Filter</div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="wordCount">0</div>
      <div class="stat-label">Filtered Words</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="hiddenCount">—</div>
      <div class="stat-label">Posts Hidden</div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- ADD WORD -->
    <div>
      <div class="section-label">Add Filter Word</div>
      <div class="input-row">
        <input
          class="word-input"
          id="wordInput"
          type="text"
          placeholder="e.g. politics, crypto…"
          maxlength="60"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="add-btn" id="addBtn" title="Add word">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- WORD CHIPS -->
    <div>
      <div class="section-label">Active Filters</div>
      <div class="chips-container" id="chipsContainer">
        <div class="empty-state" id="emptyState">No words added yet</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- MATCH TYPE -->
    <div class="match-section">
      <div class="section-label">Match Type</div>
      <div class="match-options">
        <div class="match-option">
          <input type="radio" name="matchType" id="matchExact" value="exact" />
          <label for="matchExact">
            <span class="opt-title">Exact</span>
            <span class="opt-desc">"cool" only</span>
          </label>
        </div>
        <div class="match-option">
          <input type="radio" name="matchType" id="matchContains" value="contains" checked />
          <label for="matchContains">
            <span class="opt-title">Contains</span>
            <span class="opt-desc">"coolest" too</span>
          </label>
        </div>
      </div>
    </div>

    <!-- CLEAR ALL -->
    <div class="footer-actions">
      <button class="clear-btn" id="clearBtn" disabled>Clear All Words</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
